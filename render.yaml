services:
  - type: web
    name: stock-screener
    runtime: python
    plan: starter
    buildCommand: npm ci --prefix frontend && npm run build --prefix frontend && pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT --workers 1 --no-proxy-headers
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: NODE_VERSION
        value: 20.19.1
      - key: TSE_ENVIRONMENT
        value: production
      - key: TSE_ENABLE_DOCS
        value: "false"
      - key: TSE_ALLOWED_HOSTS
        value: "*.onrender.com"
      - key: TSE_FORCE_HTTPS_HEADERS
        value: "true"
      - key: TSE_ADMIN_USER
        sync: true
      - key: TSE_ADMIN_PASSWORD
        sync: false
      - key: TSE_JWT_SECRET
        generateValue: true
      # Set this in the Render dashboard when the frontend is on another
      # origin. Same-origin deployments should leave it empty.
      - key: TSE_CORS_ORIGINS
        sync: false
      # Set only the proxy ranges that terminate public traffic.
      - key: TSE_TRUSTED_PROXY_CIDRS
        sync: false
      - key: TSE_PROVIDER_MIN_INTERVAL_MS
        value: "25"
      - key: TSE_MAX_REQUEST_BYTES
        value: "2097152"
      - key: TSE_CACHE_MAX_FILES
        value: "2000"
      - key: TSE_CACHE_MAX_BYTES
        value: "536870912"
      - key: TSE_LEGACY_PORTFOLIO_USER_ID
        sync: false
      - key: TSE_DATA_DIR
        value: /data

    # Starter supports a persistent disk. Keep one worker while SQLite and
    # JSON state are used; do not scale this service horizontally.
    disk:
      name: screener-data
      mountPath: /data
      sizeGB: 1
