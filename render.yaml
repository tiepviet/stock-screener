services:
  - type: web
    name: stock-screener
    env: python
    # Standard build command to install dependencies
    buildCommand: pip install -r requirements.txt
    # Start command for Streamlit
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: TSE_ADMIN_USER
        sync: true
      - key: TSE_ADMIN_PASSWORD
        sync: true
      - key: TSE_JWT_SECRET
        generateValue: true
      # Default to a local data dir inside the ephemeral filesystem.
      # The SQLite DB (users, settings, watchlist), JWT secret and caches
      # are LOST on every redeploy on the free tier — there is no persistent
      # disk there.
      #
      # On Render Starter (paid) or higher, attach a persistent disk and
      # point TSE_DATA_DIR at its mount so the DB + secret survive redeploys:
      #   - key: TSE_DATA_DIR
      #     value: /data
      #
      # Requires the disk block below to be uncommented (mountPath: /data).
      # NOTE: do NOT uncomment the disk on the free tier — Render rejects
      # deployments that reference a disk there.
      - key: TSE_DATA_DIR
        value: ./data

    # Persistent disk (paid tiers only — Starter or higher):
    # disk:
    #   name: screener-data
    #   mountPath: /data
    #   sizeGB: 1
